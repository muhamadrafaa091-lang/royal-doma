
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFA KINGDOM 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#101827;
 font-family:Arial,sans-serif;
 color:white;
}
#game{
 width:100vw;
 height:100vh;
 display:block;
}
.panel{
 position:absolute;
 top:12px;
 left:12px;
 right:12px;
 padding:13px;
 border:1px solid #d6b45c;
 border-radius:12px;
 background:#111c2de8;
 z-index:2;
}
.panel h2{margin:0;color:#f5d77e}
.panel p{margin:5px 0 0;font-size:12px;color:#d4d9e3}
.controls{
 position:absolute;
 bottom:18px;
 left:0;
 right:0;
 display:flex;
 justify-content:center;
 gap:10px;
 z-index:2;
}
button{
 background:#182a43;
 border:1px solid #d6b45c;
 color:#fff;
 padding:12px 17px;
 border-radius:10px;
 font-weight:bold;
}
</style>
</head>

<body>

<div class="panel">
 <h2>👑 RAFA KINGDOM 3D</h2>
 <p>BUILD YOUR KINGDOM • EXPLORE YOUR WORLD</p>
</div>

<div class="controls">
 <button onclick="zoom(1)">＋ Zoom</button>
 <button onclick="rotateWorld(-1)">↶ Putar</button>
 <button onclick="rotateWorld(1)">Putar ↷</button>
 <button onclick="zoom(-1)">－ Zoom</button>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc9e9);

const camera = new THREE.PerspectiveCamera(
 40,innerWidth/innerHeight,0.1,1000
);
camera.position.set(15,17,19);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.id="game";

scene.add(new THREE.HemisphereLight(0xffffff,0x526344,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

// Pulau kerajaan
const island=new THREE.Group();
scene.add(island);

const ground=new THREE.Mesh(
 new THREE.BoxGeometry(18,1.3,18),
 new THREE.MeshStandardMaterial({color:0x559b45})
);
ground.position.y=0;
ground.receiveShadow=true;
island.add(ground);

// Tanah bawah pulau
const base=new THREE.Mesh(
 new THREE.CylinderGeometry(10,8.8,2.2,8),
 new THREE.MeshStandardMaterial({color:0x795638})
);
base.position.y=-1.7;
island.add(base);

// Rumput
const grass=new THREE.Mesh(
 new THREE.BoxGeometry(17.7,.15,17.7),
 new THREE.MeshStandardMaterial({color:0x75bb51})
);
grass.position.y=.7;
island.add(grass);

// Kastil utama
function building(x,z,w,h,d,color){
 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 obj.position.set(x,.8+h/2,z);
 obj.castShadow=true;
 obj.receiveShadow=true;
 island.add(obj);
 return obj;
}

building(0,0,3,3,3,0xc6b99c);

// Menara kastil
for(const x of [-1.7,1.7]){
 for(const z of [-1.7,1.7]){
  building(x,z,.9,3,.9,0xd7c5a0);
  const roof=new THREE.Mesh(
   new THREE.ConeGeometry(.8,1.3,4),
   new THREE.MeshStandardMaterial({color:0x984334})
  );
  roof.position.set(x,4.15,z);
  roof.castShadow=true;
  island.add(roof);
 }
}

// Atap utama
const roof=new THREE.Mesh(
 new THREE.ConeGeometry(2.5,1.7,4),
 new THREE.MeshStandardMaterial({color:0x9c3930})
);
roof.position.set(0,3.3,0);
roof.rotation.y=Math.PI/4;
island.add(roof);

// Pepohonan
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.25,1.2,7),
  new THREE.MeshStandardMaterial({color:0x79502d})
 );
 trunk.position.set(x,1.3,z);
 island.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1,2.5,7),
  new THREE.MeshStandardMaterial({color:0x24753a})
 );
 leaves.position.set(x,2.8,z);
 leaves.castShadow=true;
 island.add(leaves);
}

[
 [-6,-5],[-5,3],[6,-5],[5,5],
 [-7,0],[7,1],[-3,6],[3,-7],
 [0,7]
].forEach(p=>tree(p[0],p[1]));

// Bebatuan
function rock(x,z){
 const mesh=new THREE.Mesh(
  new THREE.DodecahedronGeometry(.65),
  new THREE.MeshStandardMaterial({color:0x858b91})
 );
 mesh.position.set(x,.95,z);
 mesh.scale.y=.7;
 island.add(mesh);
}
rock(-5,-7);
rock(6,7);
rock(-7,5);

// Lampu
const ambient=new THREE.AmbientLight(0xffffff,.3);
scene.add(ambient);

// Kontrol kamera
window.zoom=function(dir){
 camera.position.multiplyScalar(dir>0?.88:1.14);
};

window.rotateWorld=function(dir){
 island.rotation.y+=dir*.25;
};

// Animasi
function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
